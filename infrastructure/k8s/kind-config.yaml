kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: data-platform-local
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Reserved for exposing a service via NodePort 30000 later.
    # The Airflow UI currently uses `kubectl port-forward` instead.
    extraPortMappings:
      - containerPort: 30000
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker